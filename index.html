<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZIRAH COLLECTION</title>
<style>
body{font-family:Arial;margin:0;background:#fff8f0;text-align:center}
header{background:#111;color:#d4af37;padding:20px 15px;position:relative}
header h1{margin:0;letter-spacing:3px;font-size:32px}
header p{font-size:14px;line-height:1.6;margin:8px 0 0}
.topcart{position:absolute;top:15px;right:12px;background:#d4af37;color:#111;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer;font-size:14px}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:15px;padding:15px}
.card{background:#fff;width:160px;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #0002;text-decoration:none;color:#000}
.card img{width:100%;height:220px;object-fit:cover}
.card b{display:block;padding:8px}
.price{color:#b8860b;padding-bottom:10px;font-weight:bold}
.btn{background:#25D366;color:#fff;padding:12px 20px;border-radius:25px;display:inline-block;margin:10px;text-decoration:none;font-weight:bold;border:none;font-size:16px;cursor:pointer}
#cartbox{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0008;z-index:99}
#cartinner{background:#fff;margin:60px 15px;padding:20px;border-radius:15px;text-align:left}
.qty{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid #111;background:#fff;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<header><h1>ZIRAH</h1><div class="topcart" onclick="openCart()">🛒 <span id="cart">0</span></div><p>Premium Winter & Summer Collection<br>Cash on Delivery All Pakistan</p></header>
<h2>Our Collection - Rs. 2400</h2>
<div class="grid">
<a class="card" href="product.html?id=purple"><img src="purple-1.jpg"><b>Purple Suit</b><div class="price">Rs. 2400</div></a>
<a class="card" href="product.html?id=black"><img src="black-1.jpg"><b>Black Suit</b><div class="price">Rs. 2400</div></a>
<a class="card" href="product.html?id=navy"><img src="navy-1.jpg"><b>Navy Blue Suit</b><div class="price">Rs. 2400</div></a>
</div>
<div id="cartbox"><div id="cartinner"><h2>Your Cart</h2><div id="items"></div><p id="total"></p><a class="btn" id="wa" href="#">Order on WhatsApp</a><br><button class="btn" style="background:#111" onclick="document.getElementById('cartbox').style.display='none'">Close</button></div></div>
<script>
function getCart(){try{return JSON.parse(localStorage.getItem('zirah_items')||'[]')}catch(e){return[]}}
document.getElementById('cart').innerText=getCart().length;
function changeQty(name,delta){let c=getCart();if(delta>0){c.push(name)}else{let i=c.lastIndexOf(name);if(i>-1)c.splice(i,1)}localStorage.setItem('zirah_items',JSON.stringify(c));document.getElementById('cart').innerText=c.length;openCart()}
function openCart(){let c=getCart();let counts={};c.forEach(x=>counts[x]=(counts[x]||0)+1);let html=Object.keys(counts).length?Object.keys(counts).map(n=>'<div class="qty"><span>'+n+'<br>Rs. '+(counts[n]*2400)+'</span><span><button onclick="changeQty(\''+n+'\',-1)">-</button> '+counts[n]+' <button onclick="changeQty(\''+n+'\',1)">+</button></span></div>').join(''):'<p>Cart is empty.</p>';document.getElementById('items').innerHTML=html;document.getElementById('total').innerText=c.length?'Total: Rs. '+(c.length*2400):'';let msg='Assalam-o-Alaikum! I want to order:\n'+Object.keys(counts).map(n=>n+' x '+counts[n]).join('\n')+'\nTotal: Rs. '+(c.length*2400)+' COD';document.getElementById('wa').href='https://wa.me/923001234567?text='+encodeURIComponent(msg);document.getElementById('cartbox').style.display='block'}
</script>
</body>
</html>
