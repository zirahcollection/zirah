<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coming Soon - ZIRAH</title>
<style>
body{font-family:Arial;margin:0;background:#fff8f0;text-align:center}
header{background:linear-gradient(rgba(0,0,0,.82),rgba(0,0,0,.88)),url('purple-1.jpg');background-size:cover;background-position:center top;color:#d4af37;padding:22px 15px;position:relative;border-bottom:2px solid #d4af37;overflow:hidden}
header h1{margin:0;letter-spacing:5px;font-size:32px}
.menubtn{position:absolute;top:14px;left:10px;background:#d4af37;color:#111;padding:8px 12px;border-radius:25px;font-weight:bold;cursor:pointer;font-size:18px;border:2px solid #fff;z-index:5}
.topcart{position:absolute;top:14px;right:10px;background:#d4af37;color:#111;padding:8px 12px;border-radius:25px;font-weight:bold;cursor:pointer;font-size:14px;border:2px solid #fff;display:flex;align-items:center;gap:5px}
.topcart svg{width:20px;height:20px;fill:#000}
#menubg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0008;z-index:98}
#menu{position:fixed;top:0;left:-280px;width:260px;max-width:80%;height:100%;background:#111;color:#fff;z-index:99;transition:left .3s;text-align:left;padding:20px 0;overflow-y:auto;border-right:2px solid #d4af37}
#menu.open{left:0}
#menu h3{color:#d4af37;padding:0 18px;letter-spacing:3px;margin:0 0 10px}
#menu .close{position:absolute;top:10px;right:12px;background:none;border:none;color:#d4af37;font-size:22px;cursor:pointer}
.mitem{padding:13px 18px;cursor:pointer;font-weight:bold;font-size:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.mitem span{color:#d4af37}
.sub{display:none;background:#1a1a1a}
.sub a{display:block;padding:12px 18px 12px 35px;color:#fff;text-decoration:none;font-size:15px;border-bottom:1px solid #222}
.sub.open{display:block}
.box{background:#fff;margin:40px 15px;padding:40px 20px;border-radius:15px;box-shadow:0 2px 10px #0002;max-width:420px;margin-left:auto;margin-right:auto}
.box h2{font-size:32px;margin:0;color:#111}
.box p{color:#666;line-height:1.6}
.btn{background:#111;color:#d4af37;padding:12px 22px;border-radius:25px;display:inline-block;margin-top:15px;text-decoration:none;font-weight:bold;border:2px solid #d4af37}
.btn2{background:#25D366;color:#fff;padding:12px 22px;border-radius:25px;display:inline-block;margin-top:10px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<header><div class="menubtn" onclick="openMenu()">☰</div><h1>ZIRAH</h1><div class="topcart" onclick="location.href='index.html'">🛒 <span id="cart">0</span></div></header>
<div id="menubg" onclick="closeMenu()"></div>
<div id="menu">
<button class="close" onclick="closeMenu()">✕</button>
<h3>ZIRAH</h3>
<div class="mitem" onclick="toggleSub('winterSub',this)">Winter <span>▾</span></div>
<div class="sub" id="winterSub">
<a href="index.html">❄ Printed</a>
<a href="coming-soon.html?cat=Winter%20Embroidered">✨ Embroidered</a>
</div>
<div class="mitem" onclick="toggleSub('summerSub',this)">Summer <span>▾</span></div>
<div class="sub" id="summerSub">
<a href="coming-soon.html?cat=Summer%20Printed">☀ Printed</a>
<a href="coming-soon.html?cat=Summer%20Embroidered">✨ Embroidered</a>
</div>
<div class="mitem" onclick="location.href='index.html'">🏠 All Collection</div>
</div>
<div class="box">
<div style="font-size:50px">⏳</div>
<h2 id="catTitle">Coming Soon</h2>
<p id="catDesc">Ye collection jald aa rahi hai.<br>Stay tuned!</p>
<a class="btn" href="index.html">← Back to Winter Printed</a><br>
<a class="btn2" href="https://wa.me/923707666223?text=Assalam-o-Alaikum! ZIRAH Collection - New Collection ka poochna hai">WhatsApp pe Poochain</a>
</div>
<script>
function openMenu(){document.getElementById('menu').classList.add('open');document.getElementById('menubg').style.display='block'}
function closeMenu(){document.getElementById('menu').classList.remove('open');document.getElementById('menubg').style.display='none'}
function toggleSub(id,el){var s=document.getElementById(id);var isOpen=s.classList.contains('open');document.querySelectorAll('.sub').forEach(function(x){x.classList.remove('open')});document.querySelectorAll('.mitem span').forEach(function(x){x.innerText='▾'});if(!isOpen){s.classList.add('open');el.querySelector('span').innerText='▴'}}
var cat=new URLSearchParams(location.search).get('cat')||'New Collection';
document.getElementById('catTitle').innerText=cat + ' - Coming Soon';
document.getElementById('catDesc').innerHTML=cat+' Collection<br>Jald aa rahi hai. Stay tuned!';
try{document.getElementById('cart').innerText=JSON.parse(localStorage.getItem('zirah_items')||'[]').length}catch(e){}
</script>
</body>
</html>
