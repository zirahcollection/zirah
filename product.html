<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product - ZIRAH</title>
<style>
body{font-family:Arial;margin:0;background:#fff8f0;text-align:center}
header{background:#111;color:#d4af37;padding:15px}
img{width:90%;max-width:320px;border-radius:12px;margin-top:15px}
.btn{background:#25D366;color:#fff;padding:12px 22px;border-radius:25px;display:inline-block;margin:8px;text-decoration:none;font-weight:bold;border:none;font-size:16px}
.back{color:#111;display:block;margin-top:15px}
</style>
</head>
<body>
<header><h2>ZIRAH</h2></header>
<h1 id="name">Suit</h1>
<img id="pic" src="purple-1.jpg">
<h2>Rs. 2400 • Cash on Delivery</h2>
<p>Premium Fabric • Beautiful Stitching • All Pakistan Delivery</p>
<button class="btn" onclick="add()">Add to Cart</button><br>
<a class="btn" id="wa" href="#">WhatsApp Pe Order Karein</a>
<a class="back" href="index.html">← Wapas Jao</a>
<p>Cart: <span id="cart">0</span> items</p>
<script>
let id=new URLSearchParams(location.search).get('id')||'purple';
let names={purple:'Purple Suit',black:'Black Suit',navy:'Navy Blue Suit'};
document.getElementById('name').innerText=names[id]||'Suit';
document.getElementById('pic').src=id+'-1.jpg';
document.getElementById('wa').href='https://wa.me/923001234567?text='+encodeURIComponent('Assalam-o-Alaikum! Mujhe '+ (names[id]||'Suit') +' order karna hai. Rs.2400 COD');
document.getElementById('cart').innerText=localStorage.getItem('zirah_cart')||0;
function add(){let c=parseInt(localStorage.getItem('zirah_cart')||0)+1;localStorage.setItem('zirah_cart',c);document.getElementById('cart').innerText=c;alert('Cart me add ho gaya!')}
</script>
</body>
</html>
