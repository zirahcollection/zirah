<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product - ZIRAH</title>
<style>
body{font-family:Arial;margin:0;background:#fff8f0;text-align:center}
header{background:linear-gradient(rgba(0,0,0,.82),rgba(0,0,0,.88)),url('purple-1.jpg');background-size:cover;background-position:center top;color:#d4af37;padding:20px 15px;position:relative;border-bottom:2px solid #d4af37;overflow:hidden}
header h2{margin:0;letter-spacing:5px;font-size:28px}
.main{max-width:420px;margin:auto;padding:0 12px 20px}
.imgwrap{position:relative;display:inline-block;margin-top:15px}
#big{width:90%;max-width:320px;border-radius:12px;display:block}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:22px;cursor:pointer;z-index:2}
.arrow:hover{background:#d4af37;color:#111}
.arrowL{left:5px}
.arrowR{right:5px}
.thumbs{display:flex;gap:10px;justify-content:center;margin:12px 0}
.thumbs img{width:80px;height:110px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
.thumbs img.active{border-color:#d4af37}
.btn{background:#25D366;color:#fff;padding:12px 22px;border-radius:25px;display:inline-block;margin:8px;text-decoration:none;font-weight:bold;border:none;font-size:16px;cursor:pointer}
.navbtn{background:#111;color:#d4af37;padding:10px 18px;border-radius:20px;border:1px solid #d4af37;cursor:pointer;font-weight:bold;font-size:14px;margin:5px}
.topcart{position:absolute;top:12px;right:10px;background:#d4af37;color:#111;padding:8px 12px;border-radius:25px;font-weight:bold;cursor:pointer;font-size:14px;box-shadow:0 4px 12px rgba(212,175,55,.6);border:2px solid #fff;display:flex;align-items:center;gap:5px}
.topcart svg{width:20px;height:20px;fill:#000}
.back{color:#111;display:block;margin-top:15px}
.colors{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0}
.colors button{padding:9px 14px;border-radius:20px;border:2px solid #ddd;background:#fff;cursor:pointer;font-weight:bold;font-size:13px}
.colors button.active{background:#111;color:#d4af37;border-color:#d4af37}
#cartbox{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0008;z-index:99}
#cartinner{background:#111;color:#fff;margin:60px 15px;padding:20px;border-radius:15px;text-align:left;border:1px solid #d4af37}
#cartinner h2{color:#d4af37}
.qty{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #333;color:#fff}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid #d4af37;background:#000;color:#d4af37;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<header><h2>ZIRAH</h2><div class="topcart" onclick="openCart()"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.13.12-.27.12-.42 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg> <span id="cart">0</span></div></header>
<div class="main">
<h1 id="name">Suit</h1>

<!-- PIC PE ARROW - Pic badalne ke liye -->
<div class="imgwrap">
<button class="arrow arrowL" onclick="prevPic()">‹</button>
<img id="big" src="purple-1.jpg">
<button class="arrow arrowR" onclick="nextPic()">›</button>
</div>

<div class="thumbs">
<img id="thumb1" src="purple-1.jpg" class="active" onclick="showPic(0)">
<img id="thumb2" src="purple-2.jpg" onclick="showPic(1)">
</div>
<h2>Rs. 2400 • Cash on Delivery</h2>
<p><b>Unstitched Printed Suit</b><br><b>Fabric: Dhanak</b><br>All Pakistan Delivery</p>

<div id="floralBox" style="display:none">
<p style="font-weight:bold;margin-bottom:5px">Select Colour: <span id="cname">Pink</span></p>
<div class="colors" id="colorBtns"></div>
</div>

<button class="btn" onclick="add()">Add to Cart</button><br>

<!-- SUIT BADALNE WALE ARROW -->
<div style="margin-top:12px">
<button class="navbtn" onclick="prevSuit()">← Previous Suit</button>
<button class="navbtn" onclick="nextSuit()">Next Suit →</button>
</div>

<a class="back" href="index.html">← Back</a>
</div>
<div id="cartbox"><div id="cartinner"><h2>Your Cart</h2><div id="items"></div><p id="total"></p><a class="btn" id="wa" href="#">Order on WhatsApp</a><br><button class="btn" style="background:#d4af37;color:#111" onclick="document.getElementById('cartbox').style.display='none'">Close</button></div></div>
<script>
let id=new URLSearchParams(location.search).get('id')||'purple';
let suits=['purple','black','navy','floral'];
let names={purple:'Purple Suit',black:'Black Suit',navy:'Navy Blue Suit',floral:'Floral Suit'};
document.getElementById('name').innerText=names[id]||'Suit';

var colours = {
  "Pink": ["floral-pink-1.jpg","floral-pink-2.jpg"],
  "Rust": ["floral-rust-1.jpg","floral-rust-2.jpg"],
  "Slate Blue": ["floral-slate-1.jpg","floral-slate-2.jpg"],
  "Maroon": ["floral-maroon-1.jpg","floral-maroon-2.jpg"],
  "Teal Blue": ["floral-teal-1.jpg","floral-teal-2.jpg"],
  "Green": ["floral-green-1.jpg","floral-green-2.jpg"],
  "Mustard": ["floral-mustard-1.jpg","floral-mustard-2.jpg"],
  "Navy": ["floral-navy-1.jpg","floral-navy-2.jpg"],
  "Mint": ["floral-mint-1.jpg","floral-mint-2.jpg"],
  "Purple": ["floral-purple-1.jpg","floral-purple-2.jpg"]
};
var current = "Pink";
var currentPic = 0;

if(id==='floral'){
  document.getElementById('floralBox').style.display='block';
  document.getElementById('big').src = colours[current][0];
  document.getElementById('thumb1').src = colours[current][0];
  document.getElementById('thumb2').src = colours[current][1];
  var btnBox = document.getElementById('colorBtns');
  Object.keys(colours).forEach(function(c){
    var b = document.createElement('button');
    b.innerText = c;
    if(c===current) b.className='active';
    b.onclick = function(){ selectColour(c); };
    btnBox.appendChild(b);
  });
} else {
  document.getElementById('big').src = id+'-1.jpg';
  document.getElementById('thumb1').src = id+'-1.jpg';
  document.getElementById('thumb2').src = id+'-2.jpg';
}

function selectColour(c){
  current = c; currentPic = 0;
  document.getElementById('cname').innerText = c;
  document.getElementById('big').src = colours[c][0];
  document.getElementById('thumb1').src = colours[c][0];
  document.getElementById('thumb2').src = colours[c][1];
  document.getElementById('thumb1').className='active';
  document.getElementById('thumb2').className='';
  var btns = document.getElementById('colorBtns').querySelectorAll('button');
  btns.forEach(function(x){ x.className = (x.innerText===c?'active':''); });
}
function showPic(i){
  currentPic = i;
  if(id==='floral'){ document.getElementById('big').src = colours[current][i]; }
  else { document.getElementById('big').src = id+'-'+(i+1)+'.jpg'; }
  document.getElementById('thumb1').className = i===0?'active':'';
  document.getElementById('thumb2').className = i===1?'active':'';
}
// PIC WALE ARROW
function prevPic(){ showPic(currentPic===0?1:0); }
function nextPic(){ showPic(currentPic===0?1:0); }
// SUIT WALE ARROW
function goSuit(dir){
  let idx = suits.indexOf(id); if(idx<0) idx=0;
  let next = (idx+dir+suits.length)%suits.length;
  location.href = 'product.html?id='+suits[next];
}
function prevSuit(){ goSuit(-1); }
function nextSuit(){ goSuit(1); }

function getCart(){try{return JSON.parse(localStorage.getItem('zirah_items')||'[]')}catch(e){return[]}}
function updateCount(){document.getElementById('cart').innerText=getCart().length}
updateCount();
function add(){
  let c=getCart();
  let itemName = names[id]||'Suit';
  if(id==='floral') itemName = 'Floral Suit - ' + current;
  c.push(itemName);
  localStorage.setItem('zirah_items',JSON.stringify(c));
  updateCount();
  alert('Added to Cart: ' + itemName);
}
function changeQty(name,delta){let c=getCart();if(delta>0){c.push(name)}else{let i=c.lastIndexOf(name);if(i>-1)c.splice(i,1)}localStorage.setItem('zirah_items',JSON.stringify(c));updateCount();openCart()}
function openCart(){let c=getCart();let counts={};c.forEach(x=>counts[x]=(counts[x]||0)+1);let html=Object.keys(counts).length?Object.keys(counts).map(n=>'<div class="qty"><span>'+n+'<br>Rs. '+(counts[n]*2400)+'</span><span><button onclick="changeQty(\''+n+'\',-1)">-</button> '+counts[n]+' <button onclick="changeQty(\''+n+'\',1)">+</button></span></div>').join(''):'<p>Cart is empty.</p>';document.getElementById('items').innerHTML=html;document.getElementById('total').innerText=c.length?'Total: Rs. '+(c.length*2400):'';let msg='Assalam-o-Alaikum! I want to order:\n'+Object.keys(counts).map(n=>n+' x '+counts[n]).join('\n')+'\nTotal: Rs. '+(c.length*2400)+' COD';document.getElementById('wa').href='https://wa.me/923707666223?text='+encodeURIComponent(msg);document.getElementById('cartbox').style.display='block'}
</script>
</body>
</html>
