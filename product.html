<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product - ZIRAH</title>
<style>
body{font-family:Arial;margin:0;background:#fff8f0;text-align:center}
header{background:#111;color:#d4af37;padding:15px}
img{width:90%;max-width:320px;border-radius:12px;margin-top:15px}
.btn{background:#25D366;color:#fff;padding:12px 22px;border-radius:25px;display:inline-block;margin:8px;text-decoration:none;font-weight:bold;border:none;font-size:16px;cursor:pointer}
.cartbtn{background:#111;color:#d4af37;padding:12px 22px;border-radius:25px;display:inline-block;margin:8px;font-weight:bold;cursor:pointer}
.back{color:#111;display:block;margin-top:15px}
#cartbox{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0008}
#cartinner{background:#fff;margin:60px 15px;padding:20px;border-radius:15px;text-align:left}
</style>
</head>
<body>
<header><h2>ZIRAH</h2></header>
<h1 id="name">Suit</h1>
<img id="pic1" src="purple-1.jpg">
<img id="pic2" src="purple-2.jpg">
<h2>Rs. 2400 • Cash on Delivery</h2>
<p><b>Unstitched Printed Suit</b><br><b>Fabric: Dhanak</b><br>All Pakistan Delivery</p>
<button class="btn" onclick="add()">Add to Cart</button><br>
<div class="cartbtn" onclick="openCart()">🛒 Cart: <span id="cart">0</span> items</div><br>
<a class="back" href="index.html">← Back</a>
<div id="cartbox"><div id="cartinner"><h2>Your Cart</h2><div id="items"></div><p id="total"></p><a class="btn" id="wa" href="#">WhatsApp Pe Order Karein</a><br><button class="btn" style="background:#111" onclick="document.getElementById('cartbox').style.display='none'">Band Karein</button></div></div>
<script>
let id=new URLSearchParams(location.search).get('id')||'purple';
let names={purple:'Purple Suit',black:'Black Suit',navy:'Navy Blue Suit'};
document.getElementById('name').innerText=names[id]||'Suit';
document.getElementById('pic1').src=id+'-1.jpg';
document.getElementById('pic2').src=id+'-2.jpg';
function getCart(){try{return JSON.parse(localStorage.getItem('zirah_items')||'[]')}catch(e){return[]}}
document.getElementById('cart').innerText=getCart().length;
function add(){let c=getCart();c.push(names[id]||'Suit');localStorage.setItem('zirah_items',JSON.stringify(c));document.getElementById('cart').innerText=c.length;alert('Cart me add ho gaya!')}
function openCart(){let c=getCart();document.getElementById('items').innerHTML=c.length?c.map(x=>'<p>• '+x+' - Rs.2400</p>').join(''):'<p>Cart khaali hai.</p>';document.getElementById('total').innerText=c.length?'Total: Rs. '+(c.length*2400):'';document.getElementById('wa').href='https://wa.me/923001234567?text='+encodeURIComponent('Assalam-o-Alaikum! Mujhe ye order karna hai:\n'+c.join('\n')+'\nTotal: Rs. '+(c.length*2400)+' COD');document.getElementById('cartbox').style.display='block'}
</script>
</body>
</html>
